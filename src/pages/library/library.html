<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Better Udemy Library</title>
  <link rel="stylesheet" href="library.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title">Better Udemy Library</h1>
    <div class="app-header__meta">
      <span id="status-text" class="status-text">Carregando…</span>
      <button id="refresh-button" class="button button--secondary" type="button">Atualizar</button>
    </div>
  </header>

  <main class="app-main">
    <section class="controls">
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="Buscar por título ou instrutor…"
        autocomplete="off"
      />

      <div class="filter-group" role="group" aria-label="Filtrar por status">
        <button class="filter-button is-active" data-filter="all" type="button">Todos</button>
        <button class="filter-button" data-filter="in_progress" type="button">Em andamento</button>
        <button class="filter-button" data-filter="completed" type="button">Concluídos</button>
      </div>

      <label class="sort-label" for="sort-select">
        Ordenar por
        <select id="sort-select" class="sort-select">
          <option value="name_asc">Nome A-Z</option>
          <option value="name_desc">Nome Z-A</option>
          <option value="progress_desc">Maior progresso</option>
          <option value="progress_asc">Menor progresso</option>
        </select>
      </label>
    </section>

    <p id="results-count" class="results-count"></p>

    <div id="banner" class="banner" hidden></div>

    <div id="course-grid" class="course-grid" hidden></div>

    <div id="empty-state" class="empty-state" hidden></div>
  </main>

  <script type="module" src="library.js"></script>
</body>
</html>
